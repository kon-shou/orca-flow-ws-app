name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 共通は非公開のリポジトリなので、読むだけのトークンで取り込む
      - name: 共通を読むための git の設定
        env:
          COMMON_READ_TOKEN: ${{ secrets.COMMON_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${COMMON_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${COMMON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm test
